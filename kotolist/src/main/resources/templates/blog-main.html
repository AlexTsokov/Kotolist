<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Блог</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<header th:insert="~{blocks/header :: header}"></header>
<div class="container mt-5">
    <h1>Блог Котолиста</h1><br>
    <div th:each="postCat : ${posts}" class="alert alert-info mt-2">
       <h3 th:text="${postCat.tittle}"/>
        <p th:text="${postCat.anons}"></p>
        <p><b>Порода:</b> <span th:text="${postCat.catbreed}"/></p>
        <p><b>Проcмотры:</b> <span th:text="${postCat.views}"/></p>
   <a th:href="'/blog/' + ${postCat.id}" class="btn btn-warning">Подробнее о коте</a>
    </div>
</div>
<div th:insert="~{blocks/footer :: footer}"></div>
</body>
</html>
