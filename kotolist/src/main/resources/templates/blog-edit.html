<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Редактирование кота</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<header th:insert="~{blocks/header :: header}"></header>
<div class="container mt-5 mb-5">
  <h1>Редактирование кота</h1><br>
  <div th:each="postCat : ${postCat}">
  <form method="post">
    <input type="text" th:value="${postCat.tittle}" name="tittle" placeholder="Имя кота" class="form-control"><br>
    <input type="text" th:value="${postCat.anons}" name="anons" placeholder="Описание" class="form-control"><br>
    <textarea name="full_text" placeholder="Полный текст" class="form-control" th:text="${postCat.fulltext}"/><br>
    <button type="submit" class="btn btn-success">Обновить кота</button>
  </form>
  </div>
</div>
<div th:insert="~{blocks/footer :: footer}"></div>
</body>
</html>
