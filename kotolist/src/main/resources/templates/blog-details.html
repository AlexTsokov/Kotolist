<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Блог</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<header th:insert="~{blocks/header :: header}"></header>
<div class="container mt-5">
    <div th:each="postCat : ${postCat}" class="alert alert-info mt-2">
        <h3 th:text="${postCat.tittle}"/><br>
        <img src="https://i.pinimg.com/736x/ab/73/52/ab7352d6061ddc6b40c31d7b50612dfd--cat-tags-funny-animals.jpg" alt="" width="300" height="300" /><br><br>
        <p th:text="${postCat.anons}"></p>
        <p th:text="${postCat.fulltext}"></p>
        <p><b>Проcмотры:</b> <span th:text="${postCat.views}"/></p>
        <p><b>Редактировано:</b> <span th:text="${postCat.creationtime}"/></p>
        <a th:href="'/blog/' + ${postCat.id} + '/edit'" class="btn btn-warning">Редактировать</a><br><br>
        <form th:action="'/blog/' + ${postCat.id} + '/delete'" method="post">
            <button class="btn btn-warning" type="submit">Удалить</button>
        </form>

    </div>
</div>
<div th:insert="~{blocks/footer :: footer}"></div>
</body>
</html>
